apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:5006"
            - name: PATIENT_SERVICE_URL
              value: "http://patient-service:5001"
            - name: DOCTOR_SERVICE_URL
              value: "http://doctor-service:5002"
            - name: APPOINTMENT_SERVICE_URL
              value: "http://appointment-service:5003"
            - name: TELEMEDICINE_SERVICE_URL
              value: "http://telemedicine-service:5004"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:5005"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:5007"
            - name: SYMPTOM_CHECKER_URL
              value: "http://symptom-checker-service:5008"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: healthcare
spec:
  selector:
    app: api-gateway
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30000
  type: NodePort
