apiVersion: apps/v1
kind: Deployment
metadata:
  name: symptom-checker-service
  namespace: healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: symptom-checker-service
  template:
    metadata:
      labels:
        app: symptom-checker-service
    spec:
      # V13 fix: pod-level default — enforce non-root regardless of what
      # the image itself does.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: symptom-checker-service
          image: symptom-checker-service:latest
          imagePullPolicy: Never
          # This service loads an ML model at startup (scikit-learn), which
          # is heavier than the plain Node services, so it gets a larger
          # ceiling than the others.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5008
---
apiVersion: v1
kind: Service
metadata:
  name: symptom-checker-service
  namespace: healthcare
spec:
  selector:
    app: symptom-checker-service
  ports:
    - port: 5008
      targetPort: 5008
  type: ClusterIP
